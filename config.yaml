# Configuración del Proyecto Captación Alicante (GVA-First)

database:
  url: "sqlite:///./data/companies.db"

gva_api:
  base_url: "https://dadesobertes.gva.es/api/3/action/datastore_search"
  resources:
    agencias_viaje: "23e56d9e-d31b-4f28-8f5f-3ce45dccdf31"
    hotels: "14c4f098-0d26-4b8b-aa7d-9c670632748a"
    viviendas_2025: "9f3d18dc-3150-4075-8dd4-4f96d5dd1868"
    turismo_activo: "a1802652-f1cb-4a7d-b8ac-5bdc0183a740"
    casas_rurales: "6b31800d-f2e8-4e99-ad4d-913aa71ad1dc"
    campings: "fd47e816-1c56-49fa-a931-0d64756be3e2"
  
  # Filtro obligatorio para limitar a la provincia de Alicante
  default_municipality: "ALICANTE"
  limit_per_request: 200

scoring:
  # 1. Puntuación por Vertical/CNAE
  cnae_weights:
    "47": 2.0  # Comercio minorista
    "49": 3.0  # Movilidad y transporte
    "50": 3.0  # Movilidad y transporte
    "86": 3.0  # Salud y cuidados
    "87": 3.0  # Salud y cuidados
    "88": 3.0  # Salud y cuidados
    "35": 3.0  # Servicios esenciales
    "36": 3.0  # Servicios esenciales
    "37": 3.0  # Servicios esenciales
    "38": 3.0  # Servicios esenciales
    "85": 2.0  # Educación y formación
    "41": 1.0  # Vivienda, construcción y reparación
    "43": 1.0  # Vivienda, construcción y reparación
  
  # 2. Arreglo Territorial: Municipios Prioritarios de Alicante
  priority_municipalities:
    - "ALICANTE"
    - "ALACANT"
    - "ELCHE"
    - "ELX"
    - "BENIDORM"
    - "TORREVIEJA"
    - "ORIHUELA"
    - "DENIA"
  
  # 3. Mapeo GVA -> CNAE (Para empresas sin CNAE oficial)
  gva_sector_mapping:
    "HOTEL": 1.0
    "CAMPING": 1.0
    "CASA RURAL": 1.0
    "TURISMO ACTIVO": 2.0 # Se asimila a formación/ocio social
    "AGENCIA DE VIAJE": 1.0
    "VIVIENDA TURISTICA": 0.5
